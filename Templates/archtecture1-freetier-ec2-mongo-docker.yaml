AWSTemplateFormatVersion: '2010-09-09'

Description: >
  Architecture 1 (free tier) - Product Catalog sample app running on a single
  Amazon Linux 2023 EC2 instance, with MongoDB 7 (DocumentDB stand-in) in Docker
  on the same host, secured with a self-signed TLS CA. Reproduces the manual
  deploy steps end to end described in https://github.com/cassions/product_catalog_sample_web_app.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network
        Parameters:
          - VpcId
          - SubnetId
          - AllowedCidr
      - Label:
          default: Instance
        Parameters:
          - InstanceType
          - KeyName
          - LatestAmiId
      - Label:
          default: Application / Database
        Parameters:
          - DocDbUsername
          - DocDbPassword
          - AppInstallFolder
          - AppSourceUrl
    ParameterLabels:
      VpcId:
        default: VPC
      SubnetId:
        default: Public subnet
      AllowedCidr:
        default: Source CIDR allowed to reach SSH and the app

Parameters:

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC to launch into (the default VPC works fine).

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: >
      Public subnet inside the VPC above. The instance gets a public IP, so the
      subnet must route to an Internet Gateway (any default-VPC subnet does).

  AllowedCidr:
    Type: String
    Description: >
      CIDR allowed to reach SSH (22) and the app (5000). Use YOUR_IP/32.
      0.0.0.0/0 exposes the lab to the whole internet.
    AllowedPattern: ^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$
    ConstraintDescription: Must be a valid CIDR, e.g. 203.0.113.10/32

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t2.micro, t3.micro, t3.small, t3.medium]
    Description: t3.micro / t2.micro are the free-tier eligible sizes.

  KeyName:
    Type: String
    Default: ''
    Description: >
      Optional EC2 key pair name for SSH. Leave empty to rely on SSM Session
      Manager only (the instance role already allows it).

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Latest Amazon Linux 2023 AMI, resolved from SSM Parameter Store.

  DocDbUsername:
    Type: String
    Default: admin
    MinLength: 1
    Description: MongoDB root username.

  DocDbPassword:
    Type: String
    Default: localdev123
    NoEcho: true
    MinLength: 8
    MaxLength: 64
    AllowedPattern: '[a-zA-Z0-9!#%*_+=:.-]+'
    ConstraintDescription: >
      8-64 chars, letters/digits and ! # % * _ + = : . - only (shell-safe set).
    Description: MongoDB root password (lab default is localdev123).

  AppInstallFolder:
    Type: String
    Default: /home/ec2-user/product_catalog
    Description: Absolute path where the app source is extracted.

  AppSourceUrl:
    Type: String
    Default: https://github.com/aws-samples/amazon-documentdb-samples/archive/refs/heads/master.tar.gz
    Description: Tarball of the aws-samples repo holding usecases/product_catalog.

Conditions:
  HasKeyName: !Not [!Equals [!Ref KeyName, '']]

Resources:

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Catalog app - SSH and Flask port from AllowedCidr
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: SSH
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedCidr
        - Description: Flask app
          IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: !Ref AllowedCidr
      # MongoDB (27017) is deliberately NOT exposed: the app talks to it over
      # localhost inside the instance.
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-sg'

  AppInstance:
    Type: AWS::EC2::Instance
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      KeyName: !If [HasKeyName, !Ref KeyName, !Ref 'AWS::NoValue']
      NetworkInterfaces:
        - DeviceIndex: 0
          AssociatePublicIpAddress: true
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref AppSecurityGroup]
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-product-catalog'
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee /var/log/user-data.log|logger -t user-data -s 2>/dev/console) 2>&1

          APP_DIR="${AppInstallFolder}"
          TLS_DIR=/etc/mongo-tls
          VENV=/opt/product-catalog-venv

          # ---------- dependencies ----------
          dnf install -y docker python3-pip openssl tar gzip aws-cfn-bootstrap

          trap '/opt/aws/bin/cfn-signal -e 1 --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region}' ERR

          systemctl enable --now docker
          usermod -aG docker ec2-user

          # ---------- TLS material for MongoDB ----------
          # Kept in /etc (not the app folder) so the mongo container user (uid 999)
          # can read the bind-mounted files; /home/ec2-user is mode 700.
          mkdir -p "$TLS_DIR"
          cd "$TLS_DIR"

          openssl req -x509 -newkey rsa:2048 -days 3650 -nodes \
            -keyout ca.key -out ca.crt -subj "/CN=local-docdb-ca"

          openssl req -newkey rsa:2048 -nodes \
            -keyout private.key -out cert_request.csr -subj "/CN=localhost"

          cat > ext.cnf <<'EOF'
          subjectAltName = DNS:localhost,IP:127.0.0.1
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature,keyEncipherment
          extendedKeyUsage = serverAuth
          EOF

          openssl x509 -req -in cert_request.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
            -out server.crt -days 825 -sha256 -extfile ext.cnf

          cat private.key server.crt > server.pem

          chown 999:999 server.pem
          chmod 600 server.pem
          chmod 644 ca.crt
          chmod 600 ca.key private.key
          rm -f cert_request.csr ext.cnf

          # ---------- MongoDB container ----------
          docker run -d --name docdb-local \
            --restart unless-stopped \
            -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME='${DocDbUsername}' \
            -e MONGO_INITDB_ROOT_PASSWORD='${DocDbPassword}' \
            -v "$TLS_DIR":/etc/mongo-tls:ro \
            mongo:7 \
            --auth --tlsMode requireTLS \
            --tlsCertificateKeyFile /etc/mongo-tls/server.pem \
            --tlsCAFile /etc/mongo-tls/ca.crt \
            --tlsAllowConnectionsWithoutCertificates

          # ---------- application ----------
          mkdir -p "$APP_DIR"
          curl -fsSL "${AppSourceUrl}" \
            | tar -xz -C "$APP_DIR" --strip-components=3 \
              amazon-documentdb-samples-master/usecases/product_catalog
          chown -R ec2-user:ec2-user "$APP_DIR"

          python3 -m venv "$VENV"
          "$VENV"/bin/pip install --upgrade pip
          "$VENV"/bin/pip install -r "$APP_DIR"/requirements.txt

          cat > /etc/product-catalog.env <<EOF
          DOCDB_HOST=localhost
          DOCDB_PORT=27017
          DOCDB_USERNAME=${DocDbUsername}
          DOCDB_PASSWORD=${DocDbPassword}
          DOCDB_TLS_CA=$TLS_DIR/ca.crt
          APP_INSTALL_FOLDER=$APP_DIR
          EOF
          chmod 600 /etc/product-catalog.env

          cat > /etc/systemd/system/product-catalog.service <<EOF
          [Unit]
          Description=Product Catalog sample app
          After=docker.service network-online.target
          Requires=docker.service

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=$APP_DIR
          EnvironmentFile=/etc/product-catalog.env
          ExecStart=$VENV/bin/python $APP_DIR/app.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now product-catalog.service

          # ---------- readiness check ----------
          READY=1
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/ >/dev/null; then READY=0; break; fi
            sleep 5
          done

          trap - ERR
          /opt/aws/bin/cfn-signal -e $READY --stack ${AWS::StackName} --resource AppInstance --region ${AWS::Region}
          exit $READY

Outputs:

  InstanceId:
    Description: EC2 instance id
    Value: !Ref AppInstance

  PublicIp:
    Description: Public IPv4 address
    Value: !GetAtt AppInstance.PublicIp

  AppUrl:
    Description: Product Catalog web app
    Value: !Sub 'http://${AppInstance.PublicIp}:5000'

  SsmSessionCommand:
    Description: Open a shell without SSH
    Value: !Sub 'aws ssm start-session --target ${AppInstance} --region ${AWS::Region}'

  SshCommand:
    Condition: HasKeyName
    Description: SSH command (needs the private key for the chosen key pair)
    Value: !Sub 'ssh -i ${KeyName}.pem ec2-user@${AppInstance.PublicIp}'
